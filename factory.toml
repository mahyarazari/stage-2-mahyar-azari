# Configuration of the data factory.
# Every tunable value lives here, not in the code. Relative paths are resolved
# against the folder of this file. Decision numbers (D1, D2, ...) refer to docs/decisions.md.

[source]
records_url = "https://data.cityofnewyork.us/resource/erm2-nwe9.json"
metadata_url = "https://data.cityofnewyork.us/api/views/erm2-nwe9.json"

[scope]
# D1: one agency whose "closed" means the same thing everywhere; six types, about 83% of HPD.
agencies = ["HPD"]
complaint_types = [
    "HEAT/HOT WATER",
    "UNSANITARY CONDITION",
    "PLUMBING",
    "PAINT/PLASTER",
    "DOOR/WINDOW",
    "WATER LEAK",
]
# D2: 18 months, end exclusive. Recent months are left out: still-open cases would
# make closing times look artificially short and would keep changing between runs.
window_start = 2024-01-01T00:00:00
window_end = 2025-07-01T00:00:00
# D24: fixed cut-off. A case closed after as_of counts as still open, so two independent
# downloads made after this date agree even though the live source keeps closing cases.
as_of = 2026-10-01T00:00:00

[fetch]
page_size = 50000          # records per HTTP request
max_retries = 5            # extra attempts after a failed request
backoff_seconds = 2.0      # wait before retry n is backoff_seconds * 2^(n-1)
timeout_seconds = 120      # per request; large pages of a busy API can be slow

[paths]
raw = "data/raw"
curated = "data/curated"
quarantine = "data/quarantine"
work = "data/work"         # intermediate results passed from one stage to the next

[references]
# D5: population per zip (MODZCTA). D7: zip -> county (borough) for checking the 311 borough.
population_url = "https://data.cityofnewyork.us/resource/pri4-ifjk.json"
zcta_county_url = "https://www2.census.gov/geo/docs/maps-data/data/rel2020/zcta520/tab20_zcta520_county20_natl.txt"

[references.county_boroughs]
# Each borough is a county (state 36 = New York); names as written in the 311 data.
"36005" = "BRONX"
"36047" = "BROOKLYN"
"36061" = "MANHATTAN"
"36081" = "QUEENS"
"36085" = "STATEN ISLAND"

[zip]
# D10: values that mean "zip unknown"; they become missing, the record is kept.
placeholders = ["N/A", "NA", "00000", "12345", "10000"]

[zip.aliases]
# D6: zips created after the 2010 reference map, joined through the zip they were split from.
"11249" = "11211"          # USPS split, July 2011

[quarantine]
# D9: the run fails if more than this share of records is quarantined.
# First full run: 0 of 927,361 records quarantined. The limit targets structural
# breakage: the smallest one worth catching (one week of data) is about 1.3%.
max_ratio = 0.01

[clean]
chunk_rows = 50000         # rows held in memory at a time
# D11: source text that means "unknown"; it becomes a missing value.
# The "Unspecified <BOROUGH>" community boards were found by the first quality report (D29).
unspecified_values = [
    "Unspecified",
    "0 Unspecified",
    "Unspecified BRONX",
    "Unspecified BROOKLYN",
    "Unspecified MANHATTAN",
    "Unspecified QUEENS",
    "Unspecified STATEN ISLAND",
]
# D11/D13: coordinates outside this box (New York City plus a small margin) become missing.
latitude_range = [40.47, 40.93]
longitude_range = [-74.27, -73.68]

[aggregate]
# D8: wide summary tables to build, and the fewest cases a cell needs to show a value.
levels = ["borough", "modzcta"]
min_cases_per_cell = 20    # D8: keeps 47.8% of neighbourhood cells; below ~20 a median is noise
rate_per = 10000           # rates are complaints per 10,000 residents

[database]
# D34: a PostgreSQL server supplied by whoever runs the project (no Docker).
# D39: no password and no port here. The driver (libpq) reads the password from
# PGPASSWORD or the pgpass file, and the port from PGPORT (default 5432).
# The DATABASE_URL environment variable replaces this whole URL.
url = "postgresql+psycopg://postgres@localhost/dba_stage2"
# The database of the URL is created if it does not exist yet (one command from an empty
# server); CREATE DATABASE has to be run while connected to another database: this one.
maintenance_database = "postgres"

[load]
# Load stage (stage 2): the published outputs go into PostgreSQL, in one transaction.
# Each SQL file runs inside that transaction with search_path set to `schema`, so the
# files use unqualified names. before_load builds the tables, after_load what needs data.
schema = "nyc311"
before_load = ["sql/nyc311/10_tables.sql"]
after_load = []

[olist]
# Stage 2, main data: Olist Brazilian E-Commerce (Kaggle olistbr/brazilian-ecommerce).
# D35: Kaggle needs a login, so the files come from a public GitHub copy and each one is
# checked byte for byte against the sha256 below. These digests agree with the ones an
# independent project pinned from a different mirror. A first mirror with the right row
# counts was rejected: it had been re-saved by a spreadsheet (dates without seconds).
base_url = "https://raw.githubusercontent.com/dapanew/Ecommify_Database_Design/main/postgresql/seed_data"
# Geolocation points outside Brazil (plus a margin) become missing, as in [clean] (D11).
latitude_range = [-34.0, 5.5]
longitude_range = [-74.5, -34.5]

[olist.files]
"product_category_name_translation.csv" = "a81f0d1f27b27e7293f761bc79e3ce8f348ee39c4b3ed3e49bde38f478586278"
"olist_geolocation_dataset.csv" = "b514f6fc991b9566aeba02aa5d67e2c3630f034b60a0e05aa0d082a3b66d88d6"
"olist_customers_dataset.csv" = "983a422239e1712ded753b3bf9ecf47dc73f144d306029dcfa99e70a226883d2"
"olist_sellers_dataset.csv" = "1f643d2b950373b85735e7794b20986f528d7a000432e7c6f9bcbb44d0846a0e"
"olist_products_dataset.csv" = "3e6569628a17fbc75fd206ee357b59e20364b9afa90f5b6cd5b4d624c58aa9cc"
"olist_orders_dataset.csv" = "8df58ef3d2d7e9944010f7beecd9b75367f5588ec6e3c91cec19ae3345ef9ecf"
"olist_order_items_dataset.csv" = "0bc4d068c4fe38cbb01bd90e8746e3c613fe7b4baef75fab7b0e329701c3e279"
"olist_order_payments_dataset.csv" = "4f713964f2815dbbaa40b9488268c55aac3627bfce5aa96cf58d1f3616de3cc0"
"olist_order_reviews_dataset.csv" = "012b61c7593e34f51fa614efdf802b9c7056ce6aae5307ddb93236e7cfc797d7"

[olist.load]
schema = "olist"
before_load = ["sql/olist/10_tables.sql"]
after_load = ["sql/olist/20_complete_parents.sql", "sql/olist/30_views_functions.sql",
              "sql/olist/40_snapshots.sql", "sql/olist/50_indexes.sql", "sql/olist/60_refresh_snapshots.sql"]

[dashboard]
# The five product-team queries (sql/queries/) are measured with these parameters.
# Whole history = the heaviest case the dashboard can ask for.
start = 2016-01-01T00:00:00
end = 2019-01-01T00:00:00
top_n = 20                 # Q4: number of sellers
budget_ms = 200            # limit per query, on the 95th percentile of the timed runs
warmup_runs = 3            # cache and plan warm, as for a dashboard opened often
timed_runs = 30
